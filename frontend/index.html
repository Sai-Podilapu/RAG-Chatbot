<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f4f0;
      --surface:   #ffffff;
      --border:    #e8e6e1;
      --border2:   #d4d1ca;
      --text-1:    #1a1916;
      --text-2:    #6b6860;
      --text-3:    #a8a49e;
      --accent:    #d45f2e;
      --accent-dk: #b84f22;
      --accent-lt: #fff0eb;
      --user-bg:   #1a1916;
      --user-text: #f5f4f0;
      --bot-bg:    #ffffff;
      --tag-bg:    #f0ede8;
      --radius:    14px;
      --radius-sm: 8px;
      --shadow:    0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
    }

    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-1); -webkit-font-smoothing: antialiased; }

    .layout { display: flex; height: 100vh; max-width: 1100px; margin: 0 auto; }

    /* ── Sidebar ── */
    .sidebar { width: 280px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 28px 20px; gap: 24px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-icon svg { width: 18px; height: 18px; fill: white; }
    .logo-text { font-size: 15px; font-weight: 600; color: var(--text-1); letter-spacing: -0.02em; }
    .logo-sub { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 1px; }
    .sidebar-section { display: flex; flex-direction: column; gap: 6px; }
    .sidebar-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); padding: 0 4px; margin-bottom: 2px; }
    .quick-chip { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-size: 13px; color: var(--text-2); text-align: left; transition: all 0.15s; line-height: 1.3; }
    .quick-chip:hover { background: var(--tag-bg); border-color: var(--border); color: var(--text-1); }
    .quick-chip .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
    .sidebar-spacer { flex: 1; }
    .kb-status { background: var(--tag-bg); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .kb-status-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .kb-label { color: var(--text-2); }
    .kb-value { font-weight: 500; color: var(--text-1); font-family: 'DM Mono', monospace; }
    .kb-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf7d; display: inline-block; margin-right: 6px; }
    .kb-dot.orange { background: var(--accent); }
    .ingest-btn { width: 100%; padding: 9px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); font-family: inherit; font-size: 12px; font-weight: 500; color: var(--text-2); cursor: pointer; transition: all 0.15s; }
    .ingest-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }
    .ingest-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Chat area ── */
    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { padding: 20px 28px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; }
    .chat-header-left { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-lt); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar svg { width: 18px; height: 18px; }
    .chat-header-name { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .chat-header-status { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 4px; margin-top: 1px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf7d; }
    .new-chat-btn { padding: 7px 14px; background: transparent; border: 1px solid var(--border2); border-radius: 20px; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--text-2); cursor: pointer; transition: all 0.15s; }
    .new-chat-btn:hover { background: var(--tag-bg); color: var(--text-1); }

    /* ── Messages ── */
    .messages { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 12px; padding: 40px 20px; text-align: center; animation: fadeUp 0.4s ease both; }
    .welcome-icon { width: 56px; height: 56px; background: var(--accent-lt); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
    .welcome-icon svg { width: 28px; height: 28px; }
    .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text-1); letter-spacing: -0.02em; }
    .welcome p { font-size: 14px; color: var(--text-2); max-width: 320px; line-height: 1.6; }
    .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .welcome-chip { padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-family: inherit; font-size: 13px; color: var(--text-2); cursor: pointer; transition: all 0.15s; }
    .welcome-chip:hover { background: var(--accent-lt); border-color: var(--accent); color: var(--accent-dk); }

    .msg-row { display: flex; gap: 12px; animation: fadeUp 0.3s ease both; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--tag-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .msg-avatar.bot { background: var(--accent-lt); }
    .msg-avatar svg { width: 14px; height: 14px; }
    .msg-content { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
    .msg-row.user .msg-content { align-items: flex-end; }

    .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.65; word-break: break-word; }
    .bubble.bot { background: var(--bot-bg); border: 1px solid var(--border); color: var(--text-1); border-bottom-left-radius: 4px; }
    .bubble.user { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .bubble p + p { margin-top: 8px; }
    .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; display: flex; flex-direction: column; gap: 4px; }
    .bubble strong { font-weight: 600; }
    .msg-time { font-size: 10px; color: var(--text-3); padding: 0 2px; }

    /* ── KB notice (green) ── */
    .kb-notice { display: flex; flex-direction: column; gap: 5px; padding: 8px 12px; background: #f0fdf4; border: 1.5px solid #86efac; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; color: #166534; margin-top: 6px; }
    .kb-notice-header { display: flex; align-items: center; gap: 6px; }
    .kb-notice-header svg { width: 12px; height: 12px; flex-shrink: 0; }
    .kb-source-links { display: flex; flex-direction: column; gap: 3px; padding-left: 8px; border-left: 2px solid #86efac; margin-top: 3px; }
    .kb-source-label { font-size: 10px; font-weight: 600; color: #166534; text-transform: uppercase; letter-spacing: 0.05em; }
    .kb-source-item { font-size: 12px; color: #15803d; }

    /* ── Web notice (orange) ── */
    .web-notice { display: flex; flex-direction: column; gap: 5px; padding: 8px 12px; background: #fff7ed; border: 1.5px solid #fb923c; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; color: #9a3412; margin-top: 6px; }
    .web-notice-header { display: flex; align-items: center; gap: 6px; }
    .web-notice-header svg { width: 12px; height: 12px; flex-shrink: 0; }
    .web-source-links { display: flex; flex-direction: column; gap: 3px; padding-left: 8px; border-left: 2px solid #fb923c; margin-top: 3px; }
    .web-source-label { font-size: 10px; font-weight: 600; color: #9a3412; text-transform: uppercase; letter-spacing: 0.05em; }
    .web-source-item { font-size: 12px; color: #7c2d12; }
    .web-source-item a { color: #b45309; font-weight: 500; text-decoration: underline; }

    /* ── Typing ── */
    .typing-bubble { display: flex; align-items: center; gap: 4px; padding: 12px 16px; background: var(--bot-bg); border: 1px solid var(--border); border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: bounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    .bubble.error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

    /* ── Input bar ── */
    .input-bar { padding: 16px 28px 20px; border-top: 1px solid var(--border); background: var(--surface); }
    .input-wrap { display: flex; align-items: flex-end; gap: 10px; background: var(--bg); border: 1.5px solid var(--border2); border-radius: 16px; padding: 8px 8px 8px 16px; transition: border-color 0.2s; }
    .input-wrap:focus-within { border-color: var(--accent); }
    #chat-input { flex: 1; background: transparent; border: none; outline: none; font-family: inherit; font-size: 14px; color: var(--text-1); resize: none; min-height: 24px; max-height: 120px; line-height: 1.5; padding: 2px 0; }
    #chat-input::placeholder { color: var(--text-3); }
    .send-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.15s; }
    .send-btn:hover { background: var(--accent-dk); transform: scale(1.04); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 16px; height: 16px; fill: white; }
    .input-hint { font-size: 11px; color: var(--text-3); margin-top: 8px; text-align: center; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text-1); color: #f5f4f0; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #166534; }
    .toast.error { background: #b91c1c; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 680px) { .sidebar { display: none; } .chat-header { padding: 16px 18px; } .messages { padding: 18px; } .input-bar { padding: 12px 18px 16px; } }
  </style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20"><path d="M10 2C5.58 2 2 5.58 2 10s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm1 11H9V9h2v4zm0-6H9V5h2v2z"/></svg>
      </div>
      <div>
        <div class="logo-text">Help Desk</div>
        <div class="logo-sub">AI-powered support</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Quick topics</div>
      <button class="quick-chip" onclick="sendQuick(this.textContent.trim())"><span class="chip-dot"></span>How do I get started?</button>
      <button class="quick-chip" onclick="sendQuick(this.textContent.trim())"><span class="chip-dot"></span>What are the available plans?</button>
      <button class="quick-chip" onclick="sendQuick(this.textContent.trim())"><span class="chip-dot"></span>How to reset my password?</button>
      <button class="quick-chip" onclick="sendQuick(this.textContent.trim())"><span class="chip-dot"></span>Contact support</button>
    </div>

    <div class="sidebar-spacer"></div>

    <div class="kb-status">
      <div class="kb-status-row">
        <span class="kb-label"><span class="kb-dot" id="kb-dot"></span>Knowledge base</span>
        <span class="kb-value" id="kb-count">—</span>
      </div>
      <div class="kb-status-row">
        <span class="kb-label" style="font-size:11px;color:var(--text-3)">chunks indexed</span>
      </div>
      <button class="ingest-btn" id="ingest-btn" onclick="triggerIngest()">↑ Sync documents</button>
    </div>
  </aside>

  <!-- Chat area -->
  <main class="chat-area">
    <header class="chat-header">
      <div class="chat-header-left">
        <div class="avatar">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="7" r="3.5" stroke="#d45f2e" stroke-width="1.5"/>
            <path d="M3.5 17c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5" stroke="#d45f2e" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="chat-header-name">Support Assistant</div>
          <div class="chat-header-status"><span class="status-dot"></span> Online · Replies instantly</div>
        </div>
      </div>
      <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
    </header>

    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="chat-input" placeholder="Ask anything…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Send">
          <svg viewBox="0 0 20 20"><path d="M3 10l14-8-5 8 5 8-14-8z"/></svg>
        </button>
      </div>
      <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:8000';
  let history  = [];
  let isLoading = false;

  window.addEventListener('DOMContentLoaded', () => { showWelcome(); loadStats(); });

  function showWelcome() {
    document.getElementById('messages').innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M14 3C8.48 3 4 7.48 4 13c0 2.4.85 4.6 2.26 6.32L4 24l4.92-2.18A9.93 9.93 0 0014 23c5.52 0 10-4.48 10-10S19.52 3 14 3z" fill="#d45f2e" opacity=".15"/>
            <path d="M14 3C8.48 3 4 7.48 4 13c0 2.4.85 4.6 2.26 6.32L4 24l4.92-2.18A9.93 9.93 0 0014 23c5.52 0 10-4.48 10-10S19.52 3 14 3z" stroke="#d45f2e" stroke-width="1.5" fill="none"/>
            <circle cx="10" cy="13" r="1.2" fill="#d45f2e"/>
            <circle cx="14" cy="13" r="1.2" fill="#d45f2e"/>
            <circle cx="18" cy="13" r="1.2" fill="#d45f2e"/>
          </svg>
        </div>
        <h2>How can I help you today?</h2>
        <p>Ask me anything. I'll search our knowledge base and find you the right answer.</p>
        <div class="welcome-chips">
          <button class="welcome-chip" onclick="sendQuick('How do I get started?')">Get started</button>
          <button class="welcome-chip" onclick="sendQuick('What are the available plans?')">View plans</button>
          <button class="welcome-chip" onclick="sendQuick('How do I contact support?')">Contact support</button>
          <button class="welcome-chip" onclick="sendQuick('What documents do I need?')">Required docs</button>
        </div>
      </div>`;
  }

  async function loadStats() {
    try {
      const res  = await fetch(`${API}/stats`);
      const data = await res.json();
      const count = data.total_chunks ?? 0;
      document.getElementById('kb-count').textContent = count.toLocaleString();
      document.getElementById('kb-dot').className = 'kb-dot' + (count === 0 ? ' orange' : '');
    } catch { document.getElementById('kb-count').textContent = 'offline'; }
  }

  async function triggerIngest() {
    const btn = document.getElementById('ingest-btn');
    btn.disabled = true; btn.textContent = 'Syncing…';
    try {
      const res  = await fetch(`${API}/ingest`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({force:false}) });
      const data = await res.json();
      showToast(`✓ Synced ${data.ingested} file(s) · ${data.skipped} skipped`, 'success');
      loadStats();
    } catch (e) { showToast(e.message || 'Could not reach the server', 'error'); }
    finally { btn.disabled = false; btn.textContent = '↑ Sync documents'; }
  }

  function sendQuick(text) { document.getElementById('chat-input').value = text; sendMessage(); }

  async function sendMessage() {
    const input    = document.getElementById('chat-input');
    const question = input.value.trim();
    if (!question || isLoading) return;

    input.value = ''; autoResize(input);
    isLoading   = true;
    document.getElementById('send-btn').disabled = true;

    const msgs    = document.getElementById('messages');
    const welcome = msgs.querySelector('.welcome');
    if (welcome) welcome.remove();

    appendBubble('user', question);
    history.push({ role: 'user', content: question });

    const typingId = appendTyping();
    try {
      const res = await fetch(`${API}/chat`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ question, history: history.slice(-12) }),
      });
      if (!res.ok) throw new Error((await res.text()) || `Server error ${res.status}`);
      const data = await res.json();
      removeTyping(typingId);
      appendBubble('bot', data.answer ?? 'No answer returned.', data.sources ?? [], data.source_type ?? 'none');
      history.push({ role: 'assistant', content: data.answer ?? '' });
    } catch (e) {
      removeTyping(typingId);
      appendError(e.message || 'Could not reach the server. Please check that the backend is running.');
    } finally {
      isLoading = false;
      document.getElementById('send-btn').disabled = false;
      input.focus();
    }
  }

  function buildSourceNotice(sources, sourceType) {
    // ── KB notice (green) ────────────────────────────────────────────────────
    if (sourceType === 'knowledge_base') {
      if (!sources || sources.length === 0) return '';
      const items = sources.map((s, i) => {
        const name = typeof s === 'string' ? s : (s.source || s.title || JSON.stringify(s));
        return `<span class="kb-source-item">${i + 1}. 📄 ${name}</span>`;
      }).join('');
      return `
        <div class="kb-notice">
          <div class="kb-notice-header">
            <svg viewBox="0 0 14 14" fill="none" stroke="#16a34a" stroke-width="1.4">
              <rect x="2" y="1" width="10" height="12" rx="1.5"/>
              <line x1="4.5" y1="4.5" x2="9.5" y2="4.5"/>
              <line x1="4.5" y1="7" x2="9.5" y2="7"/>
              <line x1="4.5" y1="9.5" x2="7.5" y2="9.5"/>
            </svg>
            <span>Answered from knowledge base</span>
          </div>
          <div class="kb-source-links">
            <span class="kb-source-label">Sources:</span>
            ${items}
          </div>
        </div>`;
    }

    // ── Web notice (orange) ──────────────────────────────────────────────────
    if (sourceType === 'web') {
      const linkItems = (sources || []).map((s, i) => {
        const url   = typeof s === 'object' ? s.url   : s;
        const title = typeof s === 'object' ? s.title : '';
        if (!url) return null;
        const href    = /^https?:\/\//i.test(url) ? url : `https://${url}`;
        const display = title || getHostname(url);
        return `<span class="web-source-item">${i + 1}. <a href="${href}" target="_blank" rel="noopener">${display}</a></span>`;
      }).filter(Boolean).join('');

      const linksBlock = linkItems
        ? `<div class="web-source-links"><span class="web-source-label">Sources:</span>${linkItems}</div>`
        : '';

      return `
        <div class="web-notice">
          <div class="web-notice-header">
            <svg viewBox="0 0 14 14" fill="none" stroke="#ea580c" stroke-width="1.4">
              <circle cx="7" cy="7" r="6"/>
              <path d="M7 1c-1.5 2-2 4-2 6s.5 4 2 6M7 1c1.5 2 2 4 2 6s-.5 4-2 6M1 7h12"/>
            </svg>
            <span>⚠️ Not in knowledge base · Answered from web search</span>
          </div>
          ${linksBlock}
        </div>`;
    }

    return '';
  }

  function getHostname(url) {
    try { return new URL(/^https?:\/\//i.test(url) ? url : `https://${url}`).hostname; }
    catch { return url; }
  }

  function appendBubble(role, text, sources, sourceType) {
    const msgs   = document.getElementById('messages');
    const time   = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const botSvg = `<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="#d45f2e" stroke-width="1.5"/><path d="M3.5 17c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5" stroke="#d45f2e" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    const usrSvg = `<svg viewBox="0 0 20 20" fill="#6b6860"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5"/></svg>`;

    const notice = (role === 'bot') ? buildSourceNotice(sources || [], sourceType || 'none') : '';

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    row.innerHTML = `
      <div class="msg-avatar ${role}">${role === 'bot' ? botSvg : usrSvg}</div>
      <div class="msg-content">
        <div class="bubble ${role}">${formatText(text)}</div>
        ${notice}
        <span class="msg-time">${time}</span>
      </div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendError(text) {
    const msgs = document.getElementById('messages');
    const row  = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="msg-avatar bot"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="#d45f2e" stroke-width="1.5"/><path d="M3.5 17c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5" stroke="#d45f2e" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <div class="msg-content"><div class="bubble error">${text}</div></div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendTyping() {
    const msgs = document.getElementById('messages');
    const id   = 'typing-' + Date.now();
    const row  = document.createElement('div');
    row.className = 'msg-row bot'; row.id = id;
    row.innerHTML = `
      <div class="msg-avatar bot"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3.5" stroke="#d45f2e" stroke-width="1.5"/><path d="M3.5 17c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5" stroke="#d45f2e" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <div class="msg-content"><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return id;
  }

  function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

  function formatText(text) {
    let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
    t = t.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
    t = t.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    t = t.split(/\n{2,}/).map(p => {
      if (p.startsWith('<ul>') || p.startsWith('<li>')) return p;
      return `<p>${p.replace(/\n/g,'<br>')}</p>`;
    }).join('');
    return t;
  }

  function newChat() { history = []; showWelcome(); }
  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

  async function confirmDelete() {
    const specific = prompt('Delete a specific file? Type its exact S3 key (e.g. MyDoc.pdf)\n\nLeave blank and press OK to wipe the ENTIRE database.');
    if (specific === null) return;
    if (!window.confirm(`Are you sure you want to delete ${specific.trim() ? '"'+specific.trim()+'"' : 'the entire database'}? This cannot be undone.`)) return;
    await deleteDB(specific.trim());
  }

  async function deleteDB(source = '') {
    const btn = document.getElementById('delete-btn');
    btn.disabled = true; btn.textContent = 'Deleting…';
    try {
      const res  = await fetch(`${API}/delete`, { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({source}) });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      showToast(`✓ Deleted ${data.deleted} chunk(s) from ${data.source === 'all' ? 'entire database' : '"'+data.source+'"'}`, 'success');
      loadStats();
    } catch (e) { showToast(e.message || 'Delete failed', 'error'); }
    finally { btn.disabled = false; btn.textContent = '🗑 Clear database'; }
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }
</script>
</body>
</html>
